server {
    listen 8099 default_server;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # HAOS Ingress 请求由 Supervisor 从这个地址转发。
    allow 172.30.32.2;
    deny all;

    client_max_body_size 2m;

    # Ingress 路径兼容脚本。
    location = /_yyb_ingress.js {
        alias /etc/nginx/yyb/ingress.js;

        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;

        proxy_read_timeout 210s;
        proxy_send_timeout 210s;

        # sub_filter 处理前必须关闭上游压缩。
        proxy_set_header Accept-Encoding "";

        # 在所有 HTML 页面中注入 Ingress 路径转换脚本。
        sub_filter_once on;
        sub_filter '</head>' '<script>(function(){var p=location.pathname,m="/api/hassio_ingress/",i=p.indexOf(m),e=i<0?-1:p.indexOf("/",i+m.length),b=i<0?"/":(e<0?p+"/":p.slice(0,e+1)),s=document.createElement("script");s.src=b+"_yyb_ingress.js";s.async=false;document.head.appendChild(s)}())</script></head>';
    }
}
